<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Sfondo cerchio sfumato -->
  <circle cx="24" cy="24" r="22" fill="url(#grad)" />

  <!-- Lampadina stilizzata: base -->
  <rect x="19" y="33" width="10" height="2.5" rx="1.25" fill="white" opacity="0.9"/>
  <rect x="20.5" y="35.5" width="7" height="2" rx="1" fill="white" opacity="0.7"/>

  <!-- Lampadina: corpo -->
  <path d="M24 12C19.03 12 15 16.03 15 21c0 3.2 1.6 6.03 4 7.76V30a1 1 0 001 1h8a1 1 0 001-1v-1.24C31.4 27.03 33 24.2 33 21c0-4.97-4.03-9-9-9z" fill="white" opacity="0.95"/>

  <!-- Raggi luce -->
  <line x1="24" y1="8" x2="24" y2="10" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="14.5" y1="11.5" x2="16" y2="13" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="33.5" y1="11.5" x2="32" y2="13" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="11" y1="21" x2="13" y2="21" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="37" y1="21" x2="35" y2="21" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Euro dentro la lampadina -->
  <text x="24" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="url(#gradText)">€</text>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
</svg>
